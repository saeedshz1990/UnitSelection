name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore src/UnitSelection.sln

      - name: Build
        run: dotnet build src/UnitSelection.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/UnitSelection.sln --configuration Release --no-build